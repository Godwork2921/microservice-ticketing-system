spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_TICKET:ticket_db}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ticket-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ticketing}
server:
  port: ${SERVER_PORT_TICKET:8085}
app:
  security:
    enabled: ${SECURITY_ENABLED:false}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    local-dir: ${TICKET_STORAGE_DIR:./data/tickets}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: ${MINIO_BUCKET:ticketing-tickets}
  ticket:
    confirm-attempts: ${TICKET_CONFIRM_ATTEMPTS:10}
    confirm-delay-ms: ${TICKET_CONFIRM_DELAY_MS:500}
  integration:
    reservation-service-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:5000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics