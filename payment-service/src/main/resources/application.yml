spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_PAYMENT:payment_db}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ticketing}

app:
  security:
    enabled: ${SECURITY_ENABLED:false}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:ticketing-dev-webhook-secret}
  chapa:
    enabled: ${CHAPA_ENABLED:false}
    secret-key: ${CHAPA_SECRET_KEY:}
    base-url: ${CHAPA_BASE_URL:https://api.chapa.co}
    callback-url: ${CHAPA_CALLBACK_URL:http://localhost:8084/api/payments/chapa/callback}
    return-url: ${CHAPA_RETURN_URL:http://localhost:8080/payment/return}
  integration:
    reservation-service-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    batch-size: 50
    publish-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT_PAYMENT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    correlation: '%X{traceId:-}'