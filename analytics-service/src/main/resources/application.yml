spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_ANALYTICS:analytics_db}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service
server:
  port: ${SERVER_PORT_ANALYTICS:8087}
app:
  security:
    enabled: ${SECURITY_ENABLED:false}
  kafka:
    topics: ${ANALYTICS_KAFKA_TOPICS:ticketing.reservation.events,ticketing.payment.events,ticketing.ticket.events,ticketing.event.events,ticketing.notification.events}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
