spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_NOTIFICATION:notification_db}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ticketing}
server:
  port: ${SERVER_PORT_NOTIFICATION:8086}
app:
  security:
    enabled: ${SECURITY_ENABLED:false}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:5000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
